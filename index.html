<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#176b52">
<title>عيادة دكتور أمير حجي</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#176b52;
  --green2:#238467;
  --dark:#123b31;
  --gold:#c9a44c;
  --bg:#f4f7f6;
  --white:#fff;
  --text:#19332d;
  --muted:#71817c;
  --red:#c94c4c;
  --blue:#3976b8;
  --border:#e2e9e6;
  --shadow:0 8px 25px rgba(20,60,50,.08);
}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh;padding-bottom:78px}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--dark),var(--green));
  color:white;
  padding:18px 16px 22px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:48px;height:48px;border-radius:15px;
  background:white;color:var(--green);
  display:flex;align-items:center;justify-content:center;
  font-size:25px;box-shadow:0 5px 15px rgba(0,0,0,.12);
}
.brand h1{font-size:17px;margin-bottom:4px}
.brand small{opacity:.8;font-size:11px}
.header-date{font-size:11px;opacity:.8}

/* MAIN */
main{max-width:1100px;margin:auto;padding:16px}
.page-title{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;gap:10px
}
.page-title h2{font-size:21px;color:var(--dark)}
.page-title p{font-size:12px;color:var(--muted);margin-top:4px}

.primary{
  background:var(--green);color:white;
  padding:11px 15px;border-radius:12px;font-weight:bold;
  box-shadow:0 5px 14px rgba(23,107,82,.2)
}
.primary:active,.action:active,.nav-btn:active{transform:scale(.97)}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:17px;
}
.stat{
  background:white;border:1px solid var(--border);
  border-radius:17px;padding:15px;
  box-shadow:var(--shadow);
}
.stat .icon{font-size:23px;margin-bottom:8px}
.stat .num{font-size:23px;font-weight:bold;color:var(--green)}
.stat .label{font-size:11px;color:var(--muted);margin-top:4px}

.card{
  background:white;border:1px solid var(--border);
  border-radius:18px;padding:16px;
  margin-bottom:14px;box-shadow:var(--shadow)
}
.card-title{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:13px
}
.card-title h3{font-size:16px}
.card-title span{font-size:11px;color:var(--muted)}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px
}
.action{
  background:#f4f8f6;border:1px solid var(--border);
  border-radius:14px;padding:12px 5px;
  color:var(--dark);font-size:11px;font-weight:bold;
  transition:.15s
}
.action i{display:block;font-style:normal;font-size:21px;margin-bottom:7px}

.empty{
  text-align:center;padding:28px 10px;color:var(--muted);
  font-size:13px
}

/* TABLE/LISTS */
.list{display:flex;flex-direction:column;gap:9px}
.item{
  border:1px solid var(--border);
  border-radius:14px;padding:13px;
  background:#fff
}
.item-main{
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.avatar{
  width:42px;height:42px;border-radius:13px;
  background:#e7f3ee;color:var(--green);
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:16px;flex:none
}
.info{flex:1;min-width:0}
.info strong{font-size:14px;display:block}
.info small{font-size:11px;color:var(--muted);display:block;margin-top:4px}
.item-actions{display:flex;gap:5px}
.small-btn{
  width:34px;height:34px;border-radius:10px;
  background:#f1f5f3;color:var(--green);font-size:15px
}
.small-btn.danger{color:var(--red);background:#fff0f0}

.badge{
  display:inline-block;padding:5px 8px;border-radius:8px;
  background:#e7f3ee;color:var(--green);font-size:10px;
  margin-top:6px
}
.badge.gold{background:#faf4df;color:#98771d}
.badge.red{background:#fff0f0;color:#b23d3d}
.badge.blue{background:#edf4fc;color:#3976b8}

/* SEARCH */
.search{
  position:relative;margin-bottom:12px
}
.search input{
  width:100%;padding:13px 42px 13px 12px;
  border:1px solid var(--border);border-radius:13px;
  background:white;outline:none
}
.search span{
  position:absolute;right:14px;top:12px
}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field{margin-bottom:11px}
.field.full{grid-column:1/-1}
.field label{
  display:block;font-size:11px;font-weight:bold;
  color:#4c625b;margin-bottom:6px
}
.field input,.field select,.field textarea{
  width:100%;padding:12px;
  border:1px solid #dce5e1;
  border-radius:11px;background:#fbfcfc;
  outline:none;color:var(--text);font-size:13px
}
.field textarea{min-height:75px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(23,107,82,.08)
}
.required{color:var(--red)}

.money-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px
}
.money-box{
  background:#f7faf9;border:1px solid var(--border);
  border-radius:12px;padding:10px
}
.money-box small{font-size:10px;color:var(--muted)}
.money-box strong{display:block;font-size:14px;margin-top:5px}

.section-label{
  font-size:13px;font-weight:bold;color:var(--dark);
  margin:18px 0 10px;padding-right:8px;
  border-right:3px solid var(--gold)
}

.form-footer{
  display:flex;gap:9px;margin-top:16px
}
.form-footer button{flex:1;padding:13px;border-radius:12px;font-weight:bold}
.cancel{background:#eef2f0;color:#53645f}

/* TEETH */
.teeth{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
}
.tooth{
  height:38px;border:1px solid #d9e2df;
  background:#fff;border-radius:8px;
  color:#52645e;font-size:10px
}
.tooth.selected{
  background:var(--green);color:white;border-color:var(--green)
}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(10,30,25,.58);
  display:none;align-items:flex-end;
  z-index:100
}
.modal.show{display:flex}
.modal-box{
  width:100%;max-height:94vh;overflow:auto;
  background:white;border-radius:24px 24px 0 0;
  padding:18px 16px 25px;
  animation:up .2s ease
}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;position:sticky;top:0;
  background:white;padding-bottom:10px;z-index:2
}
.modal-head h3{font-size:18px}
.close{
  width:35px;height:35px;border-radius:50%;
  background:#f0f4f2;font-size:18px
}

/* ORTHO */
.ortho-box{
  background:#f1f8f5;border:1px solid #d9ebe4;
  padding:13px;border-radius:14px
}
.ortho-box.hidden{display:none}

/* PROFILE */
.profile-head{
  background:linear-gradient(135deg,var(--dark),var(--green));
  color:white;border-radius:19px;padding:18px;
  margin-bottom:13px
}
.profile-name{font-size:20px;font-weight:bold}
.profile-meta{font-size:11px;opacity:.8;margin-top:7px}
.detail-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:9px
}
.detail{
  background:#f7faf9;border-radius:12px;padding:11px
}
.detail small{display:block;color:var(--muted);font-size:10px}
.detail strong{display:block;margin-top:4px;font-size:13px}

/* NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:white;border-top:1px solid var(--border);
  height:70px;z-index:50;
  display:flex;justify-content:center
}
.nav-inner{
  width:100%;max-width:650px;
  display:grid;grid-template-columns:repeat(5,1fr)
}
.nav-btn{
  background:white;color:#7a8984;
  font-size:10px;display:flex;
  flex-direction:column;align-items:center;
  justify-content:center;gap:5px
}
.nav-btn span{font-size:20px}
.nav-btn.active{color:var(--green);font-weight:bold}

/* TOAST */
.toast{
  position:fixed;bottom:84px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#173c32;color:white;
  padding:12px 18px;border-radius:12px;
  font-size:12px;opacity:0;pointer-events:none;
  transition:.25s;z-index:200;
  box-shadow:0 8px 25px rgba(0,0,0,.2)
}
.toast.show{opacity:1;transform:translateX(-50%)}

/* DESKTOP */
@media(min-width:700px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .actions{grid-template-columns:repeat(8,1fr)}
  .modal{align-items:center}
  .modal-box{max-width:720px;border-radius:22px;max-height:90vh}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="header-row">
    <div class="brand">
      <div class="logo">🦷</div>
      <div>
        <h1>عيادة دكتور أمير حجي</h1>
        <small>نظام إدارة ومتابعة المرضى</small>
      </div>
    </div>
    <div class="header-date" id="today"></div>
  </div>
</header>

<main id="app"></main>

</div>

<nav class="bottom-nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-page="home" onclick="navigate('home')">
      <span>⌂</span>الرئيسية
    </button>
    <button class="nav-btn" data-page="patients" onclick="navigate('patients')">
      <span>👥</span>المرضى
    </button>
    <button class="nav-btn" data-page="ortho" onclick="navigate('ortho')">
      <span>🦷</span>التقويم
    </button>
    <button class="nav-btn" data-page="appointments" onclick="navigate('appointments')">
      <span>📅</span>المواعيد
    </button>
    <button class="nav-btn" data-page="accounts" onclick="navigate('accounts')">
      <span>💰</span>الحسابات
    </button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<!-- PATIENT MODAL -->
<div class="modal" id="patientModal">
<div class="modal-box">

<div class="modal-head">
  <h3 id="modalTitle">إضافة مريض جديد</h3>
  <button class="close" onclick="closePatient()">×</button>
</div>

<form id="patientForm" onsubmit="savePatient(event)">

<input type="hidden" id="editId">

<div class="section-label">معلومات المريض</div>

<div class="form-grid">

<div class="field full">
<label>اسم المريض <span class="required">*</span></label>
<input id="name" required placeholder="الاسم الكامل">
</div>

<div class="field">
<label>الجنس <span class="required">*</span></label>
<select id="gender" required>
<option value="">اختر</option>
<option>ذكر</option>
<option>أنثى</option>
</select>
</div>

<div class="field">
<label>العمر</label>
<input id="age" type="number" min="1" max="120" placeholder="العمر">
</div>

<div class="field full">
<label>رقم الهاتف</label>
<input id="phone" type="tel" placeholder="07xxxxxxxxx">
</div>

</div>

<div class="section-label">العلاج</div>

<div class="form-grid">

<div class="field full">
<label>نوع العلاج</label>
<select id="treatment">
<option value="">اختر نوع العلاج</option>
<option>فحص واستشارة</option>
<option>حشوة تجميلية</option>
<option>حشوة عادية</option>
<option>سحب عصب</option>
<option>قلع</option>
<option>قلع جراحي</option>
<option>تلبيس</option>
<option>زراعة</option>
<option>تنظيف</option>
<option>تبييض</option>
<option>علاج اللثة</option>
<option>تقويم</option>
<option>أخرى</option>
</select>
</div>

<div class="field full">
<label>الأسنان المعالجة</label>
<div class="teeth" id="teeth"></div>
</div>

<div class="field full">
<label>ملاحظات العلاج</label>
<textarea id="treatmentNotes" placeholder="اكتب ملاحظات العلاج..."></textarea>
</div>

</div>

<div class="section-label">الحساب</div>

<div class="form-grid">

<div class="field">
<label>المبلغ الكلي</label>
<input id="total" type="number" min="0" value="0" oninput="calculateRemaining()">
</div>

<div class="field">
<label>المبلغ المدفوع</label>
<input id="paid" type="number" min="0" value="0" oninput="calculateRemaining()">
</div>

</div>

<div class="money-grid">
<div class="money-box">
<small>الكلي</small>
<strong id="totalView">0 د.ع</strong>
</div>
<div class="money-box">
<small>المدفوع</small>
<strong id="paidView">0 د.ع</strong>
</div>
<div class="money-box">
<small>المتبقي</small>
<strong id="remainingView">0 د.ع</strong>
</div>
</div>

<div class="section-label">الموعد</div>

<div class="form-grid">

<div class="field">
<label>التاريخ</label>
<input id="appointmentDate" type="date">
</div>

<div class="field">
<label>الوقت</label>
<input id="appointmentTime" type="time">
</div>

<div class="field full">
<label>ملاحظة الموعد</label>
<input id="appointmentNote" placeholder="مثلاً: مراجعة بعد أسبوع">
</div>

</div>

<div class="section-label">الوصفة الطبية</div>

<div class="form-grid">

<div class="field full">
<label>اسم الدواء</label>
<input id="medicine" placeholder="مثلاً: Amoxicillin">
</div>

<div class="field full">
<label>التعليمات</label>
<textarea id="medicineInstructions" placeholder="الجرعة وطريقة الاستخدام..."></textarea>
</div>

</div>

<div class="section-label">التقويم</div>

<div class="ortho-box hidden" id="orthoBox">

<div class="form-grid">

<div class="field">
<label>نوع التقويم</label>
<select id="orthoType">
<option value="فك علوي">فك علوي</option>
<option value="فك سفلي">فك سفلي</option>
<option value="فك علوي وسفلي">فك علوي وسفلي</option>
</select>
</div>

<div class="field">
<label>تاريخ التركيب</label>
<input id="orthoStart" type="date">
</div>

<div class="field">
<label>القسط الشهري</label>
<input id="orthoMonthly" type="number" min="0" value="0">
</div>

<div class="field">
<label>رقم الجلسة</label>
<input id="orthoSession" type="number" min="1" value="1">
</div>

<div class="field">
<label>المراجعة القادمة</label>
<input id="orthoNext" type="date">
</div>

<div class="field full">
<label>ملاحظات التقويم</label>
<textarea id="orthoNotes"></textarea>
</div>

</div>

</div>

<div class="field" style="margin-top:15px">
<label>ملاحظات عامة</label>
<textarea id="notes" placeholder="أي معلومات إضافية..."></textarea>
</div>

<div class="form-footer">
<button type="button" class="cancel" onclick="closePatient()">إلغاء</button>
<button type="submit" class="primary">حفظ المريض</button>
</div>

</form>
</div>
</div>

<script>
/* =========================
   DATA
========================= */

const KEY_PATIENTS="amir_patients_v3";
const KEY_APPOINTMENTS="amir_appointments_v3";
const KEY_ACCOUNTS="amir_accounts_v3";
const KEY_RX="amir_rx_v3";

let patients=load(KEY_PATIENTS);
let appointments=load(KEY_APPOINTMENTS);
let accounts=load(KEY_ACCOUNTS);
let prescriptions=load(KEY_RX);

let currentPage="home";
let selectedTeeth=[];
let orthoMode=false;

function load(key){
  try{
    return JSON.parse(localStorage.getItem(key)||"[]");
  }catch(e){
    return [];
  }
}

function saveData(){
  localStorage.setItem(KEY_PATIENTS,JSON.stringify(patients));
  localStorage.setItem(KEY_APPOINTMENTS,JSON.stringify(appointments));
  localStorage.setItem(KEY_ACCOUNTS,JSON.stringify(accounts));
  localStorage.setItem(KEY_RX,JSON.stringify(prescriptions));
}

/* =========================
   HELPERS
========================= */

function money(n){
  return Number(n||0).toLocaleString("ar-IQ")+" د.ع";
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function todayISO(){
  const d=new Date();
  const off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}

function formatDate(date){
  if(!date)return "—";
  try{
    return new Date(date+"T00:00:00").toLocaleDateString("ar-IQ",{
      year:"numeric",month:"long",day:"numeric"
    });
  }catch(e){return date}
}

function showToast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

function escapeHTML(str){
  return String(str??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function getPatient(id){
  return patients.find(p=>p.id===id);
}

/* =========================
   INITIALIZATION
========================= */

document.getElementById("today").textContent=
new Date().toLocaleDateString("ar-IQ",{
  day:"numeric",month:"short"
});

buildTeeth();
navigate("home");

/* =========================
   NAVIGATION
========================= */

function navigate(page){
  currentPage=page;

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function render(){
  const app=document.getElementById("app");

  if(currentPage==="home")app.innerHTML=homePage();
  if(currentPage==="patients")app.innerHTML=patientsPage(false);
  if(currentPage==="ortho")app.innerHTML=patientsPage(true);
  if(currentPage==="appointments")app.innerHTML=appointmentsPage();
  if(currentPage==="accounts")app.innerHTML=accountsPage();
}

/* =========================
   HOME
========================= */

function homePage(){

  const today=todayISO();

  const todayPatients=patients.filter(p=>p.createdAt===today).length;
  const todayAppointments=appointments.filter(a=>a.date===today).length;

  const todayIncome=accounts
    .filter(a=>a.date===today)
    .reduce((s,a)=>s+Number(a.paid||0),0);

  const remaining=accounts
    .reduce((s,a)=>s+Math.max(0,Number(a.remaining||0)),0);

  const todays=appointments
    .filter(a=>a.date===today)
    .sort((a,b)=>(a.time||"").localeCompare(b.time||""))
    .slice(0,5);

  return `
  <div class="page-title">
    <div>
      <h2>الرئيسية</h2>
      <p>مرحباً بك في نظام العيادة</p>
    </div>
    <button class="primary" onclick="openPatient(false)">+ مريض</button>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="icon">👥</div>
      <div class="num">${todayPatients}</div>
      <div class="label">مرضى اليوم</div>
    </div>

    <div class="stat">
      <div class="icon">📅</div>
      <div class="num">${todayAppointments}</div>
      <div class="label">مواعيد اليوم</div>
    </div>

    <div class="stat">
      <div class="icon">💰</div>
      <div class="num">${money(todayIncome)}</div>
      <div class="label">دخل اليوم</div>
    </div>

    <div class="stat">
      <div class="icon">⏳</div>
      <div class="num">${money(remaining)}</div>
      <div class="label">المتبقي</div>
    </div>

  </div>

  <div class="card">
    <div class="card-title">
      <h3>الوصول السريع</h3>
    </div>

    <div class="actions">

      <button class="action" onclick="openPatient(false)">
        <i>👤</i>إضافة مريض
      </button>

      <button class="action" onclick="navigate('patients')">
        <i>👥</i>المرضى
      </button>

      <button class="action" onclick="openPatient(true)">
        <i>🦷</i>مريض تقويم
      </button>

      <button class="action" onclick="navigate('appointments')">
        <i>📅</i>المواعيد
      </button>

      <button class="action" onclick="navigate('accounts')">
        <i>💰</i>الحسابات
      </button>

      <button class="action" onclick="showPrescriptions()">
        <i>💊</i>الوصفات
      </button>

      <button class="action" onclick="showStatistics()">
        <i>📊</i>الإحصائيات
      </button>

function filterPatients(ortho){

  const q=(document.getElementById("patientSearch")?.value||"")
    .trim().toLowerCase();

  const list=patients.filter(p=>{
    if(ortho && !p.ortho)return false;

    return !q ||
      p.name.toLowerCase().includes(q) ||
      String(p.phone||"").includes(q);
  });

  document.getElementById("patientList").innerHTML=
    list.length
    ? list.slice().reverse().map(patientHTML).join("")
    : `<div class="empty">لا توجد نتائج</div>`;
}

========================= */

function buildTeeth(){

  const teeth=[
    18,17,16,15,14,13,12,11,
    21,22,23,24,25,26,27,28,
    48,47,46,45,44,43,42,41,
    31,32,33,34,35,36,37,38
  ];

  document.getElementById("teeth").innerHTML=
    teeth.map(t=>`
      <button type="button"
        class="tooth"
        data-tooth="${t}"
        onclick="toggleTooth(${t})">
        ${t}
      </button>
    `).join("");
}

function toggleTooth(n){

  if(selectedTeeth.includes(n)){
    selectedTeeth=selectedTeeth.filter(x=>x!==n);
  }else{
    selectedTeeth.push(n);
  }

  document.querySelectorAll(".tooth").forEach(b=>{
    b.classList.toggle(
      "selected",
      selectedTeeth.includes(Number(b.dataset.tooth))
    );
  });
}

function openPatient(ortho=false){

  orthoMode=ortho;
  selectedTeeth=[];

  document.getElementById("patientForm").reset();
  document.getElementById("editId").value="";
  document.getElementById("modalTitle").textContent=
    ortho?"إضافة مريض تقويم":"إضافة مريض جديد";

  document.getElementById("orthoBox")
    .classList.toggle("hidden",!ortho);

  if(ortho){
    document.getElementById("treatment").value="تقويم";
    document.getElementById("orthoStart").value=todayISO();
    document.getElementById("orthoSession").value=1;
  }

  document.querySelectorAll(".tooth").forEach(b=>b.classList.remove("selected"));

  calculateRemaining();

  document.getElementById("patientModal").classList.add("show");
}

function closePatient(){
  document.getElementById("patientModal").classList.remove("show");
}

function editPatient(id){

  const p=getPatient(id);
  if(!p)return;

  orthoMode=!!p.ortho;

  document.getElementById("editId").value=p.id;
  document.getElementById("modalTitle").textContent="تعديل بيانات المريض";

  document.getElementById("name").value=p.name||"";
  document.getElementById("gender").value=p.gender||"";
  document.getElementById("age").value=p.age||"";
  document.getElementById("phone").value=p.phone||"";
  document.getElementById("treatment").value=p.treatment||"";
  document.getElementById("treatmentNotes").value=p.treatmentNotes||"";

  document.getElementById("total").value=p.total||0;
  document.getElementById("paid").value=p.paid||0;

  const ap=appointments.find(a=>a.patientId===id);
  document.getElementById("appointmentDate").value=ap?.date||"";
  document.getElementById("appointmentTime").value=ap?.time||"";
  document.getElementById("appointmentNote").value=ap?.note||"";

  const rx=prescriptions.find(r=>r.patientId===id);
  document.getElementById("medicine").value=rx?.medicine||"";
  document.getElementById("medicineInstructions").value=rx?.instructions||"";

  document.getElementById("notes").value=p.notes||"";

  document.getElementById("orthoBox")
    .classList.toggle("hidden",!p.ortho);

  document.getElementById("orthoType").value=p.orthoType||"فك علوي";
  document.getElementById("orthoStart").value=p.orthoStart||"";
  document.getElementById("orthoMonthly").value=p.orthoMonthly||0;
  document.getElementById("orthoSession").value=p.orthoSession||1;
  document.getElementById("orthoNext").value=p.orthoNext||"";
  document.getElementById("orthoNotes").value=p.orthoNotes||"";

  selectedTeeth=p.teeth||[];

  document.querySelectorAll(".tooth").forEach(b=>{
    b.classList.toggle(
      "selected",
      selectedTeeth.includes(Number(b.dataset.tooth))
    );
  });

  calculateRemaining();

  document.getElementById("patientModal").classList.add("show");
}

function calculateRemaining(){

  const total=Number(document.getElementById("total").value||0);
  const paid=Number(document.getElementById("paid").value||0);
  const remaining=Math.max(0,total-paid);

  document.getElementById("totalView").textContent=money(total);
  document.getElementById("paidView").textContent=money(paid);
  document.getElementById("remainingView").textContent=money(remaining);
}

function savePatient(e){

  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const gender=document.getElementById("gender").value;

  if(!name || !gender){
    showToast("يرجى إدخال الاسم والجنس");
    return;
  }

  const editId=document.getElementById("editId").value;

  const total=Number(document.getElementById("total").value||0);
  const paid=Number(document.getElementById("paid").value||0);

  const data={
    name,
    gender,
    age:document.getElementById("age").value,
    phone:document.getElementById("phone").value.trim(),
    treatment:document.getElementById("treatment").value,
    teeth:[...selectedTeeth],
    treatmentNotes:document.getElementById("treatmentNotes").value.trim(),
    total,
    paid:Math.min(paid,total),
    notes:document.getElementById("notes").value.trim(),

    ortho:orthoMode,
    orthoType:document.getElementById("orthoType").value,
    orthoStart:document.getElementById("orthoStart").value,
    orthoMonthly:Number(document.getElementById("orthoMonthly").value||0),
    orthoSession:Number(document.getElementById("orthoSession").value||1),
    orthoNext:document.getElementById("orthoNext").value,
    orthoNotes:document.getElementById("orthoNotes").value.trim()
  };

  let patient;

  if(editId){

    patient=getPatient(editId);

    if(!patient){
      showToast("المريض غير موجود");
      return;
    }

    Object.assign(patient,data);

    appointments=appointments.filter(a=>a.patientId!==editId);
    accounts=accounts.filter(a=>a.patientId!==editId);
    prescriptions=prescriptions.filter(r=>r.patientId!==editId);

  }else{

    patient={
      id:uid(),
      createdAt:todayISO(),
      ...data
    };

    patients.push(patient);
  }

  const date=document.getElementById("appointmentDate").value;
  const time=document.getElementById("appointmentTime").value;
  const appointmentNote=document.getElementById("appointmentNote").value.trim();

  if(date){
    appointments.push({
      id:uid(),
      patientId:patient.id,
      date,
      time,
      note:appointmentNote
    });
  }

  if(total>0){
    accounts.push({
      id:uid(),
      patientId:patient.id,
      date:todayISO(),
      total,
      paid:patient.paid,
      remaining:Math.max(0,total-patient.paid)
    });
  }

  const medicine=document.getElementById("medicine").value.trim();
  const instructions=document.getElementById("medicineInstructions").value.trim();

  if(medicine){
    prescriptions.push({
      id:uid(),
      patientId:patient.id,
      date:todayISO(),
      medicine,
      instructions
    });
  }

  saveData();
  closePatient();
  render();

  showToast(editId?"تم تحديث بيانات المريض":"تم حفظ المريض بنجاح");
}

function deletePatient(id){

  const p=getPatient(id);
  if(!p)return;

  if(!confirm(`هل تريد حذف المريض "${p.name}" وكل بياناته؟`))return;

  patients=patients.filter(x=>x.id!==id);
  appointments=appointments.filter(x=>x.patientId!==id);
  accounts=accounts.filter(x=>x.patientId!==id);
  prescriptions=prescriptions.filter(x=>x.patientId!==id);

  saveData();
  render();

  showToast("تم حذف المريض");
}

function addOrthoSession(id){

  const p=getPatient(id);
  if(!p)return;

  const session=Number(p.orthoSession||1)+1;

  const next=prompt(
    "أدخل تاريخ المراجعة القادمة بصيغة YYYY-MM-DD",
    p.orthoNext||todayISO()

  if(next===null)return;

  p.orthoSession=session;
  p.orthoNext=next;

  saveData();
  openProfile(id);

  showToast("تم تسجيل جلسة التقويم");

    <div class="stat">
      <div class="icon">✅</div>
      <div class="num">${money(paid)}</div>
      <div class="label">إجمالي المدفوع</div>
    </div>

  </div>

  <div class="card">
    <div class="card-title">
      <h3>معلومات النظام</h3>
    </div>

    <div class="detail-grid">

      <div class="detail">
        <small>عدد المواعيد</small>
        <strong>${appointments.length}</strong>
      </div>

      <div class="detail">
        <small>عدد الوصفات</small>
        <strong>${prescriptions.length}</strong>
      </div>

      <div class="detail">
        <small>المتبقي</small>
        <strong>${money(Math.max(0,total-paid))}</strong>
      </div>

      <div class="detail">
        <small>حالة التخزين</small>
        <strong>محلي على الجهاز</strong>
      </div>

    </div>
  </div>
  `;

  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
}

/* =========================
   BACKUP
========================= */

function backupData(){

  const backup={
    clinic:"عيادة دكتور أمير حجي",
    createdAt:new Date().toISOString(),
    patients,
    appointments,
    accounts,
    prescriptions
  };

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="amir-haji-clinic-backup.json";
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  showToast("تم إنشاء النسخة الاحتياطية");
}

/* =========================
   CLOSE MODAL ON BACKGROUND
========================= */

document.getElementById("patientModal").addEventListener("click",function(e){
  if(e.target===this)closePatient();
});

/* =========================
   PREVENT DATA LOSS ON CLOSE
========================= */

window.addEventListener("beforeunload",()=>{
  saveData();
});
</script>
