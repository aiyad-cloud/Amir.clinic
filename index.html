<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#145c49">
<title>عيادة دكتور أمير حجي | نظام العيادة</title>

<style>
*{box-sizing:border-box}
:root{
  --green:#145c49;
  --green2:#217b62;
  --green3:#e9f5f0;
  --dark:#103d32;
  --gold:#c8a34d;
  --gold2:#f8f0d9;
  --bg:#f3f7f5;
  --white:#fff;
  --text:#19342d;
  --muted:#74837e;
  --border:#dfe9e5;
  --red:#c84b4b;
  --redbg:#fff0f0;
  --blue:#3478b8;
  --bluebg:#edf5fd;
  --shadow:0 7px 25px rgba(16,61,50,.08);
}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.app{min-height:100vh;padding-bottom:80px}

/* HEADER */
.header{
 background:linear-gradient(135deg,#0e4034,#196d56);
 color:white;
 padding:16px;
 position:sticky;
 top:0;
 z-index:30;
 box-shadow:0 5px 20px #0002;
}
.header-inner{
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
 width:50px;height:50px;border-radius:17px;
 background:white;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 5px 15px #0002;
 overflow:hidden;
}
.logo svg{width:39px;height:39px}
.brand h1{font-size:16px;margin:0 0 5px}
.brand small{font-size:10px;opacity:.78}
.header-date{font-size:10px;opacity:.8}

/* MAIN */
main{max-width:1100px;margin:auto;padding:16px}
.page-head{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;margin-bottom:16px
}
.page-head h2{font-size:21px;margin:0 0 5px}
.page-head p{font-size:11px;color:var(--muted);margin:0}
.primary{
 background:var(--green);
 color:white;
 border:0;
 padding:11px 15px;
 border-radius:12px;
 font-weight:bold;
 box-shadow:0 5px 14px #145c4930;
}
.secondary{
 background:#edf3f0;color:var(--dark);
 border:1px solid var(--border);
 padding:10px 14px;border-radius:11px;font-weight:bold
}
.danger{
 background:var(--redbg)!important;
 color:var(--red)!important
}

/* WELCOME */
.welcome{
 background:linear-gradient(135deg,#103f33,#237d62);
 color:white;
 border-radius:22px;
 padding:21px;
 margin-bottom:15px;
 box-shadow:var(--shadow);
 position:relative;
 overflow:hidden;
}
.welcome:after{
 content:"🦷";
 position:absolute;
 left:-8px;
 bottom:-28px;
 font-size:110px;
 opacity:.07;
}
.welcome h2{font-size:20px;margin:0 0 9px}
.welcome p{
 margin:0;
 max-width:650px;
 line-height:1.9;
 font-size:12px;
 color:#eef8f4
}
.developer{
 margin-top:13px;
 color:#f5e5ae;
 font-size:11px;
 font-weight:bold;
}

/* STATS */
.stats{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;margin-bottom:15px
}
.stat{
 background:white;
 border:1px solid var(--border);
 border-radius:17px;
 padding:15px;
 box-shadow:var(--shadow)
}
.stat-icon{font-size:23px;margin-bottom:8px}
.stat-number{
 color:var(--green);
 font-size:19px;
 font-weight:bold;
 line-height:1.3
}
.stat-label{font-size:10px;color:var(--muted);margin-top:4px}

/* CARD */
.card{
 background:white;
 border:1px solid var(--border);
 border-radius:18px;
 padding:15px;
 margin-bottom:14px;
 box-shadow:var(--shadow)
}
.card-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 margin-bottom:13px
}
.card-head h3{font-size:15px;margin:0}
.card-head small{font-size:10px;color:var(--muted)}
.link-btn{
 background:none;color:var(--green);
 font-weight:bold;font-size:11px;border:0
}

/* QUICK */
.quick{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px
}
.quick button{
 border:1px solid var(--border);
 background:#f5f9f7;
 border-radius:13px;
 padding:12px 5px;
 color:var(--dark);
 font-size:10px;
 font-weight:bold
}
.quick span{
 display:block;
 font-size:21px;
 margin-bottom:6px
}

/* LIST */
.list{display:flex;flex-direction:column;gap:9px}
.item{
 border:1px solid var(--border);
 background:white;
 border-radius:14px;
 padding:12px
}
.item-row{
 display:flex;
 align-items:center;
 gap:10px
}
.avatar{
 width:42px;height:42px;
 flex:none;
 border-radius:13px;
 background:var(--green3);
 color:var(--green);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:16px;
 font-weight:bold
}
.item-info{flex:1;min-width:0}
.item-info strong{
 display:block;
 font-size:13px;
 margin-bottom:4px
}
.item-info small{
 display:block;
 color:var(--muted);
 font-size:10px;
 line-height:1.7
}
.item-actions{display:flex;gap:4px}
.icon-btn{
 width:32px;height:32px;
 border:0;
 border-radius:9px;
 background:#f1f5f3;
 color:var(--green);
 font-size:14px
}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.badge{
 display:inline-block;
 padding:4px 7px;
 border-radius:7px;
 font-size:9px;
 background:var(--green3);
 color:var(--green)
}
.badge.gold{background:var(--gold2);color:#92721d}
.badge.red{background:var(--redbg);color:var(--red)}
.badge.blue{background:var(--bluebg);color:var(--blue)}

/* SEARCH */
.search{position:relative;margin-bottom:12px}
.search input{
 width:100%;
 border:1px solid var(--border);
 border-radius:12px;
 padding:12px 40px 12px 12px;
 background:white;
 outline:none;
 font-size:12px
}
.search-icon{
 position:absolute;right:13px;top:11px
}

/* FORMS */
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.field{margin-bottom:10px}
.field.full{grid-column:1/-1}
.field label{
 display:block;
 font-size:10px;
 color:#53665f;
 font-weight:bold;
 margin-bottom:6px
}
.field input,
.field select,
.field textarea{
 width:100%;
 border:1px solid var(--border);
 border-radius:10px;
 background:#fbfdfc;
 padding:11px;
 outline:none;
 font-size:12px;
 color:var(--text)
}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,
.field select:focus,
.field textarea:focus{
 border-color:var(--green);
 box-shadow:0 0 0 3px #145c4912
}
.required{color:var(--red)}
.section-title{
 margin:18px 0 10px;
 border-right:3px solid var(--gold);
 padding-right:8px;
 color:var(--dark);
 font-size:13px;
 font-weight:bold
}

/* PROCEDURES */
.procedures{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px
}
.procedure{
 border:1px solid var(--border);
 background:#fff;
 color:#52635e;
 border-radius:10px;
 padding:10px 7px;
 font-size:10px;
 text-align:center
}
.procedure.selected{
 background:var(--green);
 color:white;
 border-color:var(--green)
}

/* TEETH */
.mouth{
 background:#fbfcfb;
 border:1px solid var(--border);
 border-radius:18px;
 padding:14px 8px
}
.mouth-title{
 text-align:center;
 font-size:10px;
 color:var(--muted);
 margin:4px 0 9px
}
.jaw{
 display:flex;
 justify-content:center;
 gap:3px;
 flex-wrap:nowrap;
 direction:ltr
}
.jaw.bottom{margin-top:9px}
.tooth{
 position:relative;
 width:35px;
 height:43px;
 border:1px solid #cfdad6;
 background:white;
 border-radius:48% 48% 42% 42%;
 color:#52635e;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 padding-bottom:4px;
 font-size:8px;
 transition:.15s;
 box-shadow:0 2px 3px #0000000b
}
.tooth:before{
 content:"";
 position:absolute;
 width:15px;height:18px;
 top:7px;
 border:1px solid #dbe3e0;
 border-radius:45%;
 background:#fff
}
.tooth.selected{
 background:#1b8064;
 color:white;
 border-color:#145c49;
 transform:translateY(-2px);
 box-shadow:0 4px 8px #145c4940
}
.tooth.selected:before{background:#d9f0e8;border-color:#d9f0e8}
.tooth.missing{
 opacity:.35;
 text-decoration:line-through
}
.tooth-info{
 text-align:center;
 margin-top:10px;
 color:var(--muted);
 font-size:10px
}

/* MONEY */
.money{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px
}
.money-box{
 background:#f7faf8;
 border:1px solid var(--border);
 border-radius:12px;
 padding:10px
}
.money-box small{font-size:9px;color:var(--muted)}
.money-box strong{
 display:block;
 margin-top:5px;
 font-size:12px
}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 background:#0a282099;
 display:none;
 align-items:flex-end;
 z-index:100
}
.modal.show{display:flex}
.modal-box{
 width:100%;
 max-height:95vh;
 overflow:auto;
 background:white;
 border-radius:24px 24px 0 0;
 padding:17px;
 animation:slide .2s ease
}
@keyframes slide{
 from{transform:translateY(50px);opacity:0}
 to{transform:none;opacity:1}
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 background:white;
 z-index:5;
 padding-bottom:11px;
 border-bottom:1px solid #edf1ef;
 margin-bottom:12px
}
.modal-head h3{margin:0;font-size:17px}
.close{
 width:34px;height:34px;
 border:0;border-radius:50%;
 background:#eef3f1;
 font-size:18px
}
.form-footer{
 display:flex;
 gap:8px;
 margin-top:16px;
 position:sticky;
 bottom:0;
 background:white;
 padding-top:10px
}
.form-footer button{
 flex:1;
 padding:13px;
 border-radius:11px;
 font-weight:bold
}

/* PROFILE */
.profile-cover{
 background:linear-gradient(135deg,#103f33,#247d62);
 color:white;
 border-radius:20px;
 padding:18px;
 margin-bottom:13px
}
.profile-name{font-size:20px;font-weight:bold}
.profile-sub{font-size:10px;opacity:.8;margin-top:6px}
.profile-id{
 display:inline-block;
 margin-top:10px;
 padding:5px 8px;
 background:#ffffff18;
 border:1px solid #ffffff25;
 border-radius:8px;
 font-size:9px
}
.detail-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}
.detail{
 background:#f7faf8;
 border-radius:11px;
 padding:10px
}
.detail small{
 display:block;
 color:var(--muted);
 font-size:9px
}
.detail strong{
 display:block;
 font-size:11px;
 margin-top:5px;
 line-height:1.5
}

/* TIMELINE */
.timeline{position:relative}
.visit{
 position:relative;
 border-right:3px solid #d8ebe4;
 padding:0 13px 18px 0;
 margin-right:7px
}
.visit:last-child{padding-bottom:0}
.visit-dot{
 position:absolute;
 right:-8px;
 top:0;
 width:13px;height:13px;
 background:var(--green);
 border:3px solid white;
 border-radius:50%;
 box-shadow:0 0 0 1px #cfe3dc
}
.visit-head{
 display:flex;
 justify-content:space-between;
 gap:8px;
 margin-bottom:8px
}
.visit-date{font-weight:bold;font-size:11px;color:var(--green)}
.visit-time{font-size:9px;color:var(--muted)}
.visit-box{
 background:#f8faf9;
 border:1px solid var(--border);
 border-radius:12px;
 padding:10px
}
.visit-row{
 font-size:10px;
 margin-bottom:7px;
 line-height:1.6
}
.visit-row:last-child{margin-bottom:0}
.visit-row b{color:var(--dark)}

/* ORTHO */
.ortho-panel{
 background:#f0f8f5;
 border:1px solid #d6ebe3;
 border-radius:15px;
 padding:12px
}
.session{
 border-right:3px solid var(--gold);
 padding:8px 10px;
 background:#fff;
 border-radius:10px;
 margin-bottom:7px
}
.session strong{font-size:11px}
.session small{
 display:block;
 color:var(--muted);
 font-size:9px;
 margin-top:4px;
 line-height:1.6
}

/* EMPTY */
.empty{
 text-align:center;
 padding:27px 10px;
 color:var(--muted);
 font-size:11px;
 line-height:1.8
}

/* BOTTOM */
.bottom{
 position:fixed;
 left:0;right:0;bottom:0;
 height:70px;
 background:white;
 border-top:1px solid var(--border);
 z-index:50;
 box-shadow:0 -4px 15px #00000009
}
.bottom-inner{
 max-width:650px;
 height:100%;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(5,1fr)
}
.nav{
 border:0;
 background:white;
 color:#7c8a85;
 font-size:9px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:5px
}
.nav span{font-size:20px}
.nav.active{color:var(--green);font-weight:bold}

/* TOAST */
.toast{
 position:fixed;
 bottom:84px;
 left:50%;
 transform:translate(-50%,20px);
 background:#123d32;
 color:white;
 padding:11px 17px;
 border-radius:11px;
 font-size:11px;
 opacity:0;
 pointer-events:none;
 transition:.25s;
 z-index:300;
 box-shadow:0 7px 20px #0003
}
.toast.show{
 opacity:1;
 transform:translate(-50%,0)
}

/* PRINT */
@media print{
 body{background:white}
 .header,.bottom,.no-print{display:none!important}
 main{padding:0}
 .card{box-shadow:none}
}

/* DESKTOP */
@media(min-width:700px){
 .stats{grid-template-columns:repeat(4,1fr)}
 .quick{grid-template-columns:repeat(8,1fr)}
 .procedures{grid-template-columns:repeat(4,1fr)}
 .modal{align-items:center}
 .modal-box{
  max-width:760px;
  max-height:91vh;
  border-radius:22px
 }
 .tooth{width:42px;height:50px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="header-inner">

<div class="brand">

<div class="logo">
<svg viewBox="0 0 100 100">
<path d="M30 18C17 20 12 34 17 48C21 59 22 76 30 84C35 89 41 84 45 72C47 66 53 66 55 72C59 84 65 89 70 84C78 76 79 59 83 48C88 34 83 20 70 18C60 16 56 22 50 22C44 22 40 16 30 18Z"
fill="#145c49"/>
<path d="M31 27C24 29 22 37 25 44C28 50 31 58 33 65"
fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
<circle cx="50" cy="46" r="7" fill="#c8a34d"/>
</svg>
</div>

<div>
<h1>عيادة دكتور أمير حجي</h1>
<small>نظام إدارة ومتابعة مراجعي العيادة</small>
</div>

</div>

<div class="header-date" id="headerDate"></div>

</div>
</header>

<main id="main"></main>

</div>

<div class="bottom">
<div class="bottom-inner">

<button class="nav active" data-page="home" onclick="go('home')">
<span>⌂</span>الرئيسية
</button>

<button class="nav" data-page="patients" onclick="go('patients')">
<span>👥</span>المراجعون
</button>

<button class="nav" data-page="ortho" onclick="go('ortho')">
<span>🦷</span>التقويم
</button>

<button class="nav" data-page="appointments" onclick="go('appointments')">
<span>📅</span>المواعيد
</button>

<button class="nav" data-page="accounts" onclick="go('accounts')">
<span>💰</span>الحسابات
</button>

</div>
</div>

<div class="toast" id="toast"></div>

<!-- PATIENT MODAL -->
<div class="modal" id="patientModal">
<div class="modal-box">

<div class="modal-head">
<h3 id="patientModalTitle">إضافة مراجع جديد</h3>
<button class="close" onclick="closeModal()">×</button>
</div>

<form id="patientForm" onsubmit="savePatient(event)">

<input type="hidden" id="editingPatientId">

<div class="section-title">معلومات المراجع</div>

<div class="grid">

<div class="field full">
<label>الاسم الكامل <span class="required">*</span></label>
<input id="pName" required placeholder="اسم المراجع الكامل">
</div>

<div class="field">
<label>الجنس <span class="required">*</span></label>
<select id="pGender" required>
<option value="">اختر الجنس</option>
<option value="ذكر">ذكر</option>
<option value="أنثى">أنثى</option>
</select>
</div>

<div class="field">
<label>العمر</label>
<input id="pAge" type="number" min="1" max="120" placeholder="العمر">
</div>

<div class="field full">
<label>رقم الهاتف</label>
<input id="pPhone" type="tel" placeholder="07xxxxxxxxx">
</div>

</div>

<div class="section-title">إجراءات الزيارة</div>

<div class="field">
<label>اختر إجراءً واحداً أو أكثر</label>

<div class="procedures" id="procedureList"></div>

</div>

<div class="section-title">الأسنان المعالجة</div>

<div class="mouth">

<div class="mouth-title">الفك العلوي</div>
<div class="jaw" id="upperJaw"></div>

<div class="mouth-title" style="margin-top:13px">الفك السفلي</div>
<div class="jaw bottom" id="lowerJaw"></div>

<div class="tooth-info" id="selectedTeethText">
لم يتم اختيار أي سن
</div>

</div>

<div class="field" style="margin-top:10px">
<label>
<input type="checkbox" id="allTeeth" onchange="toggleAllTeeth()">
 جميع الأسنان / تنظيف شامل
</label>
</div>

<div class="field full">
<label>تفاصيل الإجراءات وملاحظات الطبيب</label>
<textarea id="visitNotes" placeholder="اكتب ما تم عمله في هذه الزيارة..."></textarea>
</div>

<div class="section-title">الحساب</div>

<div class="grid">

<div class="field">
<label>المبلغ الكلي للزيارة</label>
<input id="visitTotal" type="number" min="0" value="0" oninput="updateMoney()">
</div>

<div class="field">
<label>المبلغ المدفوع</label>
<input id="visitPaid" type="number" min="0" value="0" oninput="updateMoney()">
</div>

</div>

<div class="money">

<div class="money-box">
<small>الكلي</small>
<strong id="moneyTotal">0 د.ع</strong>
</div>

<div class="money-box">
<small>المدفوع</small>
<strong id="moneyPaid">0 د.ع</strong>
</div>

<div class="money-box">
<small>المتبقي</small>
<strong id="moneyRemain">0 د.ع</strong>
</div>

</div>

<div class="section-title">موعد المراجعة</div>

<div class="grid">

<div class="field">
<label>التاريخ</label>
<input id="visitDate" type="date">
</div>

<div class="field">
<label>الوقت</label>
<input id="visitTime" type="time">
</div>

<div class="field full">
<label>ملاحظة الموعد</label>
<input id="appointmentNote" placeholder="مثلاً: مراجعة بعد أسبوع">
</div>

</div>

<div class="section-title">الوصفة الطبية</div>

<div class="grid">

<div class="field full">
<label>الدواء</label>
<input id="medicine" placeholder="اسم الدواء">
</div>

<div class="field full">
<label>التعليمات والجرعة</label>
<textarea id="medicineInstructions" placeholder="مثلاً: حبة كل 8 ساعات بعد الطعام"></textarea>
</div>

</div>

<div class="section-title">معلومات التقويم</div>

<div class="ortho-panel">

<div class="field">
<label>
<input type="checkbox" id="isOrtho" onchange="toggleOrthoForm()">
 هذا المراجع من مراجعي التقويم
</label>
</div>

<div id="orthoForm" style="display:none">

<div class="grid">

<div class="field">
<label>نوع التقويم</label>
<select id="orthoType">
<option>فك علوي</option>
<option>فك سفلي</option>
<option>فك علوي وسفلي</option>
</select>
</div>

<div class="field">
<label>تاريخ التركيب</label>
<input id="orthoStart" type="date">
</div>

<div class="field">
<label>إجمالي الاتفاق</label>
<input id="orthoTotal" type="number" min="0" value="0">
</div>

<div class="field">
<label>القسط الشهري</label>
<input id="orthoMonthly" type="number" min="0" value="0">
</div>

<div class="field">
<label>رقم الجلسة الحالية</label>
<input id="orthoSession" type="number" min="1" value="1">
</div>

<div class="field">
<label>المراجعة القادمة</label>
<input id="orthoNext" type="date">
</div>

<div class="field full">

function loadDB(){
 try{
  const saved=localStorage.getItem(DB_KEY);
  if(saved){
   const x=JSON.parse(saved);
   db={
    patients:Array.isArray(x.patients)?x.patients:[],
    appointments:Array.isArray(x.appointments)?x.appointments:[],
    prescriptions:Array.isArray(x.prescriptions)?x.prescriptions:[],
    payments:Array.isArray(x.payments)?x.payments:[]
   };
  }
 }catch(e){
  console.error(e);
 }
}

function saveDB(){
 localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function uid(prefix="ID"){
 return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
}

function today(){
 const d=new Date();
 const offset=d.getTimezoneOffset();
 return new Date(d.getTime()-offset*60000).toISOString().slice(0,10);
}

function nowTime(){
 return new Date().toLocaleTimeString("ar-IQ",{
  hour:"2-digit",minute:"2-digit"
 });
}

function money(n){
 return Number(n||0).toLocaleString("ar-IQ")+" د.ع";
}

function dateText(d){
 if(!d)return "—";
 try{
  return new Date(d+"T00:00:00").toLocaleDateString("ar-IQ",{
   year:"numeric",month:"long",day:"numeric"
  });
 }catch(e){return d}
}

function esc(x){
 return String(x??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function toast(text){
 const t=document.getElementById("toast");
 t.textContent=text;
 t.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.classList.remove("show"),2300);
}

function patientById(id){
 return db.patients.find(p=>p.id===id);
}

function getInitial(name){
 return (name||"؟").trim().charAt(0);
}

function renderPatients(ortho=false){

function filterPatients(ortho){

 const q=(document.getElementById("patientSearch")?.value||"")
  .trim().toLowerCase();

  if(ortho&&!p.ortho)return false;

  const text=[
   p.name,
   p.gender,
   p.phone,
   p.fileNumber
  ].join(" ").toLowerCase();

  return text.includes(q);
 });

 document.getElementById("patientList").innerHTML=
  list.length
  ? list.slice().reverse().map(patientHTML).join("")
  : `<div class="empty">لا توجد نتائج</div>`;
}

/* ================= ADD / EDIT / VISIT ================= */

function buildProcedures(){

 const el=document.getElementById("procedureList");

 el.innerHTML=PROCEDURES.map((p,i)=>`
  <button type="button"
   class="procedure"
   data-procedure="${esc(p)}"
   onclick="toggleProcedure(${i})">
   ${esc(p)}
  </button>
 `).join("");
}

function toggleProcedure(i){

 const p=PROCEDURES[i];

 if(selectedProcedures.includes(p)){
  selectedProcedures=selectedProcedures.filter(x=>x!==p);
 }else{
  selectedProcedures.push(p);
 }

 document.querySelectorAll(".procedure").forEach(b=>{
  b.classList.toggle(
   "selected",
   selectedProcedures.includes(b.dataset.procedure)
  );
 });
}

function buildTeeth(){

 document.getElementById("upperJaw").innerHTML=
  UPPER.map(toothButton).join("");

 document.getElementById("lowerJaw").innerHTML=
  LOWER.map(toothButton).join("");
}

function toothButton(n){

 return `
 <button type="button"
  class="tooth"
  data-tooth="${n}"
  onclick="toggleTooth(${n})"
  title="السن ${n}">
  ${n}
 </button>
 `;
}

function toggleTooth(n){

 if(selectedTeeth.includes(n)){
  selectedTeeth=selectedTeeth.filter(x=>x!==n);
 }else{
  selectedTeeth.push(n);
 }

 document.querySelectorAll(".tooth").forEach(b=>{
  b.classList.toggle(
   "selected",
   selectedTeeth.includes(Number(b.dataset.tooth))
  );
 });

 updateSelectedTeethText();
}

function toggleAllTeeth(){

 const checked=document.getElementById("allTeeth").checked;

 if(checked){
  selectedTeeth=[...UPPER,...LOWER];
 }else{
  selectedTeeth=[];
 }

 document.querySelectorAll(".tooth").forEach(b=>{
  b.classList.toggle(
   "selected",
   selectedTeeth.includes(Number(b.dataset.tooth))
  );
 });

 updateSelectedTeethText();
}

function updateSelectedTeethText(){

 const el=document.getElementById("selectedTeethText");

 if(!selectedTeeth.length){
  el.textContent="لم يتم اختيار أي سن";
  return;
 }

 el.textContent=
  "الأسنان المحددة: "+selectedTeeth.join(" • ");
}

function resetForm(){

 document.getElementById("patientForm").reset();

 document.getElementById("editingPatientId").value="";

 selectedTeeth=[];
 selectedProcedures=[];

 document.querySelectorAll(".tooth").forEach(b=>b.classList.remove("selected"));
 document.querySelectorAll(".procedure").forEach(b=>b.classList.remove("selected"));

 document.getElementById("visitDate").value=today();
 document.getElementById("visitTime").value=nowTime();

 document.getElementById("orthoStart").value=today();

 document.getElementById("orthoForm").style.display="none";

 updateMoney();
 updateSelectedTeethText();
}

function openNewPatient(ortho=false){

 resetForm();

 if(ortho){
  document.getElementById("isOrtho").checked=true;
  toggleOrthoForm();

  if(!selectedProcedures.includes("تقويم")){
   selectedProcedures.push("تقويم");
   document.querySelectorAll(".procedure").forEach(b=>{
    if(b.dataset.procedure==="تقويم")b.classList.add("selected");
   });
  }
 }

 document.getElementById("patientModalTitle").textContent=
  ortho?"إضافة مراجع تقويم":"إضافة مراجع جديد";

 document.getElementById("patientModal").classList.add("show");
}

function addVisit(id){

 const p=patientById(id);
 if(!p)return;

/* ================= SAVE ================= */

function savePatient(e){

 e.preventDefault();

 const name=document.getElementById("pName").value.trim();
 const gender=document.getElementById("pGender").value;

 if(!name||!gender){
  toast("يجب إدخال الاسم والجنس");
  return;
 }

 const mode=document.getElementById("editingPatientId").value;

 /* ---------- EDIT PROFILE ---------- */

 if(mode.startsWith("EDIT:")){

  const id=mode.replace("EDIT:","");
  const p=patientById(id);

  if(!p)return;

  p.name=name;
  p.gender=gender;
  p.age=document.getElementById("pAge").value;
  p.phone=document.getElementById("pPhone").value.trim();
  p.notes=document.getElementById("pNotes").value.trim();

  updateOrthoData(p);

  saveDB();
  closeModal();
  openProfile(p.id);
  toast("تم تحديث ملف المراجع");
  return;
 }

 /* ---------- ADD VISIT ---------- */

 if(mode.startsWith("VISIT:")){

  const id=mode.replace("VISIT:","");
  const p=patientById(id);

  if(!p)return;

  addVisitToPatient(p);

  saveDB();
  closeModal();
  openProfile(p.id);
  toast("تم تسجيل الزيارة الجديدة");
  return;
 }

 /* ---------- NEW PATIENT ---------- */

 /*
    المطلوب:
    إذا تطابق الاسم والجنس:
    لا ننشئ ملفاً جديداً.
    نضيف الزيارة إلى الملف الموجود.
 */

 const existing=db.patients.find(p=>
  p.name.trim().toLowerCase()===name.toLowerCase() &&
  p.gender===gender
 );

 if(existing){

  if(!confirm(
   "يوجد ملف سابق بنفس الاسم والجنس.\n\n"+
   "هل تريد إضافة هذه الزيارة إلى الملف الموجود؟"
  ))return;

  existing.age=document.getElementById("pAge").value||existing.age;
  existing.phone=document.getElementById("pPhone").value.trim()||existing.phone;
  existing.notes=document.getElementById("pNotes").value.trim()||existing.notes;

  updateOrthoData(existing);
  addVisitToPatient(existing);

  saveDB();
  closeModal();
  openProfile(existing.id);
  toast("تمت إضافة الزيارة إلى ملف المراجع الموجود");
  return;
 }

 /* NEW */

 const p={
  id:uid("PAT"),
  fileNumber:nextFileNumber(),
  name,
  gender,
  age:document.getElementById("pAge").value,
  phone:document.getElementById("pPhone").value.trim(),
  notes:document.getElementById("pNotes").value.trim(),
  createdAt:new Date().toISOString(),
  visits:[],
  balance:0,
  ortho:false,
  orthoSessions:[]
 };

 updateOrthoData(p);
 addVisitToPatient(p);

 db.patients.push(p);

 saveDB();
 closeModal();
 openProfile(p.id);

 toast("تم إنشاء ملف المراجع وتسجيل الزيارة");
}

function nextFileNumber(){

 const nums=db.patients.map(p=>{
  const m=String(p.fileNumber||"").match(/(\d+)$/);
  return m?Number(m[1]):0;
 });

 const n=Math.max(0,...nums)+1;

 return "PAT-"+String(n).padStart(4,"0");
}

function updateOrthoData(p){

 const yes=document.getElementById("isOrtho").checked;

 p.ortho=yes;

 if(!yes)return;

 p.orthoType=document.getElementById("orthoType").value;
 p.orthoStart=document.getElementById("orthoStart").value;
 p.orthoTotal=Number(document.getElementById("orthoTotal").value||0);
 p.orthoMonthly=Number(document.getElementById("orthoMonthly").value||0);
 p.orthoSession=Number(document.getElementById("orthoSession").value||1);
 p.orthoNext=document.getElementById("orthoNext").value;
 p.orthoNotes=document.getElementById("orthoNotes").value.trim();

 if(!Array.isArray(p.orthoSessions))p.orthoSessions=[];
}

function addVisitToPatient(p){

 const total=Number(document.getElementById("visitTotal").value||0);
 const paid=Math.min(
  Number(document.getElementById("visitPaid").value||0),
  total
 );
 const remaining=Math.max(0,total-paid);

 const date=document.getElementById("visitDate").value||today();
 const time=document.getElementById("visitTime").value||nowTime();

 const visit={
  id:uid("VIS"),
  date,
  time,
  procedures:[...selectedProcedures],
  teeth:[...selectedTeeth],
  allTeeth:document.getElementById("allTeeth").checked,
  notes:document.getElementById("visitNotes").value.trim(),
  total,
  paid,
  remaining
 };

 if(!Array.isArray(p.visits))p.visits=[];

 p.visits.push(visit);

 p.balance=Number(p.balance||0)+remaining;

 /* APPOINTMENT */

 const appointmentDate=document.getElementById("visitDate").value;
 const appointmentTime=document.getElementById("visitTime").value;
 const appointmentNote=document.getElementById("appointmentNote").value.trim();

 /*
   الموعد ينحفظ فقط إذا المستخدم أدخل تاريخاً
   مختلفاً عن تاريخ الزيارة، أو كتب ملاحظة موعد.
 */
 if(
  appointmentDate &&
  (
   appointmentDate>date ||
   appointmentNote
  )
 ){

  db.appointments.push({
   id:uid("APP"),
   patientId:p.id,
   date:appointmentDate,
   time:appointmentTime,
   note:appointmentNote
  });
 }

 /* PAYMENT */

 if(paid>0){

  db.payments.push({
   id:uid("PAY"),
   patientId:p.id,
   visitId:visit.id,
   date,
   amount:paid,
   total,
   remaining
  });

 }

 /* PRESCRIPTION */

 const medicine=document.getElementById("medicine").value.trim();
 const instructions=document.getElementById("medicineInstructions").value.trim();

 if(medicine){

  db.prescriptions.push({
   id:uid("RX"),
   patientId:p.id,
   visitId:visit.id,
   date,
   medicine,
   instructions
  });

 }

 /* ORTHO SESSION */

 if(p.ortho){

  if(!Array.isArray(p.orthoSessions))p.orthoSessions=[];

  const exists=p.orthoSessions.some(s=>s.visitId===visit.id);

  if(!exists){

   p.orthoSessions.push({
    id:uid("ORT"),
    visitId:visit.id,
    number:p.orthoSession||1,
    date,
    note:visit.notes
   });

  }

 }

}

function addOrthoSession(id){

 const p=patientById(id);
 if(!p)return;

 const nextNumber=Number(p.orthoSession||1)+1;

  "ملاحظات جلسة التقويم",
  ""
 );

 if(note===null)return;

 const nextDate=prompt(
  "تاريخ المراجعة القادمة YYYY-MM-DD",
  p.orthoNext||""
 );

 if(nextDate===null)return;

 p.orthoSession=nextNumber;
 p.orthoNext=nextDate;

 if(!Array.isArray(p.orthoSessions))
  p.orthoSessions=[];

 p.orthoSessions.push({
  id:uid("ORT"),
  visitId:null,
  number:nextNumber,
  date:today(),
  note
 });

 openProfile(id);
 toast("تم تسجيل جلسة التقويم");
}

function downloadBackup(){

 const data={
  system:"عيادة دكتور أمير حجي",
  developer:"إياد ايزدين",
  createdAt:new Date().toISOString(),
  database:db
 };

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="Amir-Haji-Clinic-Backup.json";

 document.body.appendChild(a);
 a.click();
 a.remove();

 URL.revokeObjectURL(url);

 toast("تم إنشاء النسخة الاحتياطية");
}

function restoreBackup(){

 const file=document.getElementById("restoreFile").files[0];

 if(!file){
  toast("اختر ملف النسخة الاحتياطية أولاً");
  return;
 }

 if(!confirm(
  "استعادة النسخة الاحتياطية ستستبدل البيانات الحالية.\nهل أنت متأكد؟"
 ))return;

 const reader=new FileReader();

 reader.onload=function(e){

  try{

   const data=JSON.parse(e.target.result);

   if(!data.database||!Array.isArray(data.database.patients)){
    throw new Error("invalid");
   }

   db={
    patients:data.database.patients||[],
    appointments:data.database.appointments||[],
    prescriptions:data.database.prescriptions||[],
    payments:data.database.payments||[]
   };

   saveDB();
   go("home");

   toast("تمت استعادة البيانات بنجاح");

  }catch(err){

   alert("ملف النسخة الاحتياطية غير صالح.");

  }

 };

 reader.readAsText(file);
}

  font-family:Tahoma,Arial;
  padding:30px;
  color:#19342d
 }
 h1{color:#145c49}
 .head{
  border-bottom:2px solid #145c49;
  padding-bottom:15px;
  margin-bottom:20px
 }
 .box{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px
 }
 .visit{
  border-right:3px solid #145c49;
  padding-right:12px;
  margin-bottom:18px
 }
 small{color:#777}
 </style>
 </head>
 <body>

 <div class="head">
  <h1>عيادة دكتور أمير حجي</h1>
  <div>ملف المراجع</div>
  <small>تطوير: إياد ايزدين</small>
 </div>

 <div class="box">
  <b>اسم المراجع:</b> ${esc(p.name)}<br>
  <b>الجنس:</b> ${esc(p.gender)}<br>
  <b>العمر:</b> ${esc(p.age)||"—"}<br>
  <b>الهاتف:</b> ${esc(p.phone)||"—"}<br>
  <b>رقم الملف:</b> ${esc(p.fileNumber)}
 </div>

 <h2>السجل الطبي</h2>

 ${
  visits.map((v,i)=>`
   <div class="visit">

    <b>الزيارة ${i+1} — ${dateText(v.date)}</b>
    ${v.time?" • "+esc(v.time):""}

    <p>
     <b>الإجراءات:</b>
     ${(v.procedures||[]).map(esc).join(" • ")||"—"}
    </p>

    <p>
     <b>الأسنان:</b>
     ${v.allTeeth?"جميع الأسنان":(v.teeth||[]).join(" • ")||"—"}
    </p>

    <p><b>الملاحظات:</b> ${esc(v.notes)||"—"}</p>

    <p>
     <b>الحساب:</b> ${money(v.total)}
     |
     <b>المدفوع:</b> ${money(v.paid)}
     |
     <b>المتبقي:</b> ${money(v.remaining)}
    </p>

   </div>
  `).join("")
 }

 </body>
 </html>
 `;

 const w=window.open("","_blank");

 if(!w){
  alert("يرجى السماح بفتح نافذة الطباعة.");
  return;
 }

 w.document.write(html);
 w.document.close();

 setTimeout(()=>w.print(),500);
}

/* ================= MODAL BACKGROUND ================= */

document.getElementById("patientModal").addEventListener("click",function(e){
 if(e.target===this)closeModal();
});

/* ================= SAVE BEFORE LEAVE ================= */

window.addEventListener("beforeunload",saveDB);

</script>

</body>
</html>
